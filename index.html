<!DOCTYPE html>
<html lang="en">

<head>
  <title>Sentient Rockets - Training</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111'/%3E%3Cpolygon points='8,2 14,14 2,14' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"
    integrity="sha384-KuaSButcSBcmbzC19JLv+LljKIziQQ7lTOUg37f83huBz49+tWag9p61U1SONpzA"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/quicksettings@3.0.1/quicksettings.min.js"
    integrity="sha384-BDtezhKREhFF3yPOT323Bq8O2mjT5BH+x8XpBJKfhBmjhXmD3yK7k8U3zcnzcEMb"
    crossorigin="anonymous"></script>
  <script src="lib/p5.gui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.collide2d@0.7.3/p5.collide2d.min.js"
    integrity="sha384-I2oyjhI1VdYpvB13L4WT0mnLiUuLE/4eZhw9rlVRtBoocv2FGj4oCKTYiyLRiKDM"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"
    integrity="sha384-vE8hbVJ4lezako5rlvE7bY0BVzWlFhZncPlckrqNwcUQpVtgbENTgZ8TBbnPjZre"
    crossorigin="anonymous"></script>
  <script type="module" src="src/main.js"></script>
</head>

<body>
  <div id="container">
    <div id="canvasDiv"></div>
    <div id="display">
      <h3>Display</h3>
    </div>
    <div id="outDiv">
      <span class="fifty">
        <div id="controls">
          <h3>Brains</h3>
          <p class="help">Train in one scene, export the best brain, then load it in another scene to evaluate it or keep training from those weights.</p>
          <label for="sceneSelect">Scene</label>
          <select id="sceneSelect"></select>
          <button id="loadSceneBtn" type="button">Load scene</button>
          <button id="exportBrain" type="button">Export best brain</button>
          <button id="importBrain" type="button">Load brain</button>
          <input id="brainFile" type="file" accept="application/json,.json" hidden />
          <button id="evaluateBrain" type="button">Evaluate loaded brain</button>
          <button id="continueBrain" type="button">Continue training from loaded</button>
          <p id="brainStatus">No brain loaded yet.</p>
        </div>
      </span>
      <span>
        <div class="fifty">
          <div id="physics">
            <h3>Physics</h3>
          </div>
        </div>
      </span>
    </div>
  </div>
</body>

</html>
